<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Important Date</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Add Important Date</h1>

    <form method="POST">

        <label for="date">Date:</label>

        <br><br>

        <input type="date"
               id="date"
               name="date"
               required>

        <br><br>

        <label for="event">Event:</label>

        <br><br>

        <input type="text"
               id="event"
               name="event"
               placeholder="Enter event name"
               required>

        <br><br>

        <button type="submit">
            Save Event
        </button>

    </form>

    <br>

    <a href="/"
       class="back-button">
         Back
    </a>

</body>

</html>
